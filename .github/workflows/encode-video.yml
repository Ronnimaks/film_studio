# ПЕРЕЖАТИЕ ВИДЕО ДЛЯ САЙТА (работает в облаке GitHub, компьютер не нагружает)
# Что делает: берёт исходники из video/*.mp4 и кладёт лёгкие копии в video/web/:
#   - формат H.264 - его показывают все телефоны (исходник hero.mp4 был в AV1 - на айфонах чёрный экран);
#   - служебные данные в начале файла (faststart) - видео стартует, не дожидаясь загрузки всего файла;
#   - без звука (на сайте ролики всё равно идут без звука), ширина до 1280;
#   - заставка .jpg из кадра на 3-й секунде - видна, пока видео грузится.
# Исходники не трогаются. Запуск: вкладка Actions -> "Пережать видео" -> Run workflow
# или командой: gh workflow run encode-video.yml
name: Пережать видео
on: workflow_dispatch
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Поставить ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Пережать
        run: |
          mkdir -p video/web
          for f in video/*.mp4; do
            n=$(basename "$f" .mp4)
            ffmpeg -y -v error -i "$f" -an -c:v libx264 -preset slow -crf 26 \
              -profile:v high -level 4.0 -pix_fmt yuv420p \
              -vf "scale='min(1280,iw)':-2" -movflags +faststart "video/web/$n.mp4"
            ffmpeg -y -v error -ss 3 -i "video/web/$n.mp4" -frames:v 1 -q:v 4 "video/web/$n.jpg"
            echo "$n: $(du -h video/web/$n.mp4 | cut -f1)"
          done
      - name: Сохранить в репозиторий
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add video/web
          git commit -m "Лёгкие копии видео и заставки (video/web)"
          git push
